name: Feature request
description: A use case the tool does not cover yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and where the current behavior stops you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: The behavior you would expect, including its limits and failure cases.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other tools you considered, and why they fall short.
  - type: textarea
    id: impact
    attributes:
      label: Contract impact
      description: Public interfaces, file formats, approvals or limits that would change.
